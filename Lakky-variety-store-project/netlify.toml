# Lakky Variety Store — Netlify deploy settings.
# Build: Next.js standalone. Set the env vars below in the Netlify dashboard
# (Site settings → Environment variables). Never commit real values.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "true"

# Required at runtime (copy values from local .env.local):
#   DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL (= Netlify link),
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   NEXT_PUBLIC_APP_URL (= Netlify link), TIMEZONE=Africa/Lagos
# Not needed on Netlify: ADMIN_EMAIL/ADMIN_PASSWORD (local owner script only), R2_*

[[plugins]]
  package = "@netlify/plugin-nextjs"
